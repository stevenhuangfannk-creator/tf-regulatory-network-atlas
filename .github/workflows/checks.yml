name: Result and workflow contracts
on: [push, pull_request, workflow_dispatch]
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: environments/requirements.txt
      - run: python -m pip install -r environments/requirements.txt
      - run: python -m unittest discover -s tests -v
# CI validates small committed results and code contracts. It skips unavailable
# large local inputs; it does not claim a complete raw-data rerun or R figure QA.
